<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>团员端 - 推车提交</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell compact-shell">
      <header class="topbar">
        <div>
          <h1>团员端</h1>
          <p>只管自己的事：提交推车、确认别人是否推了你、看自己最后捆几个。</p>
        </div>
        <nav class="top-actions" aria-label="页面入口">
          <a class="ghost-link" href="index.html">返回入口</a>
        </nav>
      </header>

      <main class="member-grid">
        <section class="panel identity-panel">
          <section class="cloud-panel member-cloud" id="memberCloudPanel" aria-label="云同步">
            <div class="section-title">
              <h2>首次配置</h2>
              <span id="cloudStatus">未连接</span>
            </div>
            <p class="hint" style="margin-bottom:10px">首次使用请输入团号，之后会自动记住。</p>
            <label class="field">
              <span>团号</span>
              <input id="cloudGroupCode" type="text" placeholder="问团长要团号" autocomplete="off" />
            </label>
            <label class="field">
              <span>盲盒</span>
              <select id="boxSelect"></select>
            </label>
            <div class="cloud-actions">
              <button class="primary-button" id="cloudConnectBtn" type="button">连接</button>
            </div>
          </section>

          <section class="cloud-panel member-cloud is-hidden" id="memberConnectedBar" aria-label="连接状态" style="text-align:center">
            <span style="margin-right:12px">团号：<strong id="connectedGroupLabel"></strong></span>
            <button class="ghost-button" id="memberSwitchBtn" type="button" style="margin-right:6px">切换</button>
            <button class="ghost-button danger-button" id="memberExitBtn" type="button">退出</button>
          </section>

          <h2>请输入cn</h2>
          <label class="field">
            <span>我的昵称</span>
            <input id="meSelect" type="text" placeholder="输入你的cn" autocomplete="off" list="memberSuggestions" />
            <datalist id="memberSuggestions"></datalist>
          </label>
          <div class="my-summary" id="mySummary"></div>
        </section>

        <section class="panel submit-panel">
          <h2>提交推车</h2>
          <div class="form-grid member-form">
            <label class="field">
              <span>申报类型</span>
              <select id="claimType">
                <option value="有效推车">有效推车</option>
                <option value="无效推车">无效推车</option>
              </select>
            </label>
            <label class="field" id="targetField">
              <span>被推来的人</span>
              <input id="targetSelect" type="text" placeholder="输入对方cn" autocomplete="off" list="targetSuggestions" />
              <datalist id="targetSuggestions"></datalist>
            </label>
            <label class="field wide">
              <span>凭证/备注</span>
              <input id="proofInput" type="text" placeholder="例如：群聊截图、社媒链接、对方昵称说明" />
            </label>
            <label class="proof-upload wide" for="proofImage">
              <strong>上传截图</strong>
              <span id="proofImageName">可上传群聊截图或社媒截图</span>
              <input id="proofImage" type="file" accept="image/*" />
            </label>
          </div>
          <button class="primary-button" id="addRecordBtn" type="button">提交推车记录</button>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>需要我确认</h2>
            <span id="confirmCount">0 条</span>
          </div>
          <div class="record-list" id="confirmList"></div>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>我提交的记录</h2>
            <span id="myRecordCount">0 条</span>
          </div>
          <div class="record-list" id="myRecordList"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="db.js"></script>
    <script src="member.js"></script>
  </body>
</html>
