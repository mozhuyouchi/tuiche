<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推车工具入口</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="entry-shell">
      <section class="entry-hero">
        <div>
          <h1>推车登记与捆物计算</h1>
          <p>两套前端，共用同一份数据：团长看全局，团员只处理自己的提交和确认。</p>
        </div>
        <div class="rule-strip">
          <span>躺吃捆 2</span>
          <span>有效推车 -1</span>
          <span>小推车多 -2</span>
          <span>最低捆 0</span>
        </div>
      </section>

      <section class="entry-grid" aria-label="选择入口">
        <a class="entry-card admin" href="admin.html">
          <span class="entry-icon">管</span>
          <strong>团长 / 管理端</strong>
          <small>导入排表、查看全部推车、处理记录、导出最终捆物表。</small>
        </a>
        <a class="entry-card member" href="member.html">
          <span class="entry-icon">员</span>
          <strong>团员端</strong>
          <small>选择自己、提交推车、确认别人是否推了自己、查看自己的捆物。</small>
        </a>
      </section>
    </main>
  </body>
</html>
